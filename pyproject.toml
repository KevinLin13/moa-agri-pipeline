[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moa-agri-pipeline"
version = "0.1.0"
description = "ETL pipeline for Taiwan agricultural market price data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]