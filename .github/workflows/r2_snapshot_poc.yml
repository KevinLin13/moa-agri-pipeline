name: R2 Snapshot Round-Trip PoC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-snapshot-poc:
    name: Upload, download, verify synthetic snapshot only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies for isolated PoC
        run: python -m pip install -e . 'boto3>=1.35,<2'

      - name: Verify R2 snapshot upload/download and SHA-256
        run: python scripts/r2_snapshot_poc.py
